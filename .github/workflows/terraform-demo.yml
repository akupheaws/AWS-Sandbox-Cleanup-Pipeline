name: Provision Sandbox Demo

on:
  workflow_dispatch:

permissions: {}

# Serialize Terraform applies and cleanup runs in the same repository.
concurrency:
  group: aws-sandbox-cleanup
  cancel-in-progress: false

jobs:
  demo:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_SANDBOX_ACCOUNT_ID: ${{ vars.AWS_SANDBOX_ACCOUNT_ID }}
      TF_VAR_sandbox_account_id: ${{ vars.AWS_SANDBOX_ACCOUNT_ID }}
      TF_VAR_demo_id: ${{ github.run_id }}-${{ github.run_attempt }}
      TF_IN_AUTOMATION: 'true'
    defaults:
      run:
        working-directory: terraform/demo
    steps:
      - name: Check out the Terraform demo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false

      - name: Initialize and validate the demo
        run: |
          terraform init -input=false -lockfile=readonly
          terraform validate

      - name: Assume the sandbox role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ env.AWS_SANDBOX_ACCOUNT_ID }}:role/GitHubSandboxCleanup
          role-session-name: SandboxDemo-${{ github.run_id }}-${{ github.run_attempt }}
          allowed-account-ids: ${{ env.AWS_SANDBOX_ACCOUNT_ID }}

      - name: Provision two regional queues and a global role
        run: |
          terraform plan -input=false -out=demo.tfplan
          terraform apply -input=false demo.tfplan

      - name: Publish resource names for verification
        run: |
          set -o pipefail
          {
            printf '### Terraform demo resources\n\n| Scope | Resource | Name |\n| --- | --- | --- |\n'
            terraform output -json | jq -r '
              (.queues.value | to_entries[] | "| \(.key) | SQS queue | \(.value) |"),
              ("| Global | IAM role | \(.global_iam_role.value) |")
            '
          } >> "$GITHUB_STEP_SUMMARY"
