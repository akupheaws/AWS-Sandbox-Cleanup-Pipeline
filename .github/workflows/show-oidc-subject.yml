name: Show AWS OIDC Subject

on:
  workflow_dispatch:

permissions: {}

jobs:
  subject:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Show the GitHub subject for this branch
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const audience = 'sts.amazonaws.com';
          const endpoint = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          endpoint.searchParams.set('audience', audience);
          const response = await fetch(endpoint, {
            headers: { Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN },
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error('GitHub OIDC request failed with HTTP ' + response.status);

          const { value } = await response.json();
          const claims = JSON.parse(Buffer.from(value.split('.')[1], 'base64url'));
          if (claims.aud !== audience || typeof claims.sub !== 'string') {
            throw new Error('Expected a subject for the AWS STS audience');
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '### GitHub OIDC trust values',
            '',
            'Audience: ' + audience,
            '',
            'Copy this exact subject into the IAM trust policy:',
            '',
            '    ' + claims.sub,
            '',
          ].join('\n'));
          NODE
