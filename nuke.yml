regions:
  # Match the approved regions in iam/developer-region-guardrails.json.
  - us-east-1
  - us-east-2
  - us-west-2

blocklist:
  # Add real accounts where cleanup must never run, such as production.
  # Leave the sample entry if this is your only account. AWS Nuke requires a blocklist.
  - '999900001111'

resource-types:
  excludes:
    - BudgetsBudget # Preserve spend alerts.
    # Preserve IAM users, their credentials, groups, and customer-managed policies.
    - IAMAccountSettingPasswordPolicy
    - IAMGroup
    - IAMGroupPolicy
    - IAMGroupPolicyAttachment
    - IAMLoginProfile
    - IAMPolicy
    - IAMServiceSpecificCredential
    - IAMSigningCertificate
    - IAMUser
    - IAMUserAccessKey
    - IAMUserGroupAttachment
    - IAMUserHTTPSGitCredential
    - IAMUserMFADevice
    - IAMUserPolicy
    - IAMUserPolicyAttachment
    - IAMUserSSHPublicKey
    - IAMVirtualMFADevice
    - S3Object # S3Bucket empties its contents, including versions, during removal.
    # AWS has shut down these services.
    - CodeStarProject
    - ElasticTranscoderPipeline
    - ElasticTranscoderPreset
    - InspectorAssessmentRun
    - InspectorAssessmentTarget
    - InspectorAssessmentTemplate
    - OpsWorksApp
    - OpsWorksInstance
    - OpsWorksLayer
    - OpsWorksUserProfile
    - OpsWorksCMBackup
    - OpsWorksCMServer
    - OpsWorksCMServerState

settings:
  CloudFormationStack:
    DisableDeletionProtection: true
  DynamoDBTable:
    DisableDeletionProtection: true
  EC2Image:
    IncludeDisabled: true
    IncludeDeprecated: true
    DisableDeregistrationProtection: true
  EC2Instance:
    DisableDeletionProtection: true
  RDSInstance:
    DisableDeletionProtection: true

accounts:
  '430986758702': # Replace with the sandbox account ID and keep it quoted.
    filters:
      CloudFormationStack:
        - property: Name
          value: aws-sandbox-cleanup-bootstrap
      # Preserve the default VPC and the components AWS creates for it.
      EC2VPC:
        - property: IsDefault
          value: "true"
      EC2Subnet:
        - property: DefaultForAz
          value: "true"
      EC2InternetGateway:
        - property: DefaultVPC
          value: "true"
      EC2InternetGatewayAttachment:
        - property: DefaultVPC
          value: "true"
      EC2DHCPOption:
        - property: DefaultVPC
          value: "true"
      EC2DefaultSecurityGroupRule:
        - property: DefaultVPC
          value: "true"
      AthenaWorkGroup:
        - property: Name
          value: primary
      # Preserve account logging and resource inventory.
      CloudWatchLogsLogGroup:
        - type: regex
          value: '.*'
      ResourceExplorer2Index:
        - type: regex
          value: '.*'
      ResourceExplorer2View:
        - type: regex
          value: '.*'
      IAMOpenIDConnectProvider:
        - type: regex
          value: '^arn:aws:iam::[0-9]{12}:oidc-provider/token\.actions\.githubusercontent\.com$'
      IAMRole:
        - GitHubSandboxCleanup
        - OrganizationAccountAccessRole
      IAMRolePolicy:
        - property: 'role:RoleName'
          value: GitHubSandboxCleanup
        - property: 'role:RoleName'
          value: OrganizationAccountAccessRole
      IAMRolePolicyAttachment:
        - property: RoleName
          value: GitHubSandboxCleanup
        - property: RoleName
          value: OrganizationAccountAccessRole
      IAMSAMLProvider:
        - property: ARN
          type: regex
          value: '^arn:aws:iam::[0-9]{12}:saml-provider/AWSSSO_'
